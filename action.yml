name: "Astro Deploy"
description: "A composite action that prepares your Astro site to be deployed to GitHub Pages"
branding:
  icon: "arrow-up-right"
  color: "purple"
inputs:
  node-version:
    description: "Node version override. Otherwise use package.json (Volta, devEngines.runtime, or engines.node), falling back to 24."
    required: false
    default: ""
  package-manager:
    description: "You may specify your preferred package manager (one of `npm | yarn | pnpm | bun | deno` and an optional `@<version>` tag). Otherwise, the package manager will be automatically detected."
    required: false
    default: ""
  path:
    description: "Path of the directory containing your site"
    required: false
    default: "."
  build-cmd:
    description: "The command used to build your site"
    required: false
    default:
  cache:
    description: "Enable Astro cache to speed up subsequent builds (caches optimized images and other assets)"
    required: false
    default: "true"
  cache-dir:
    description: "Path to the Astro cache directory (relative to 'path' input). Defaults to 'node_modules/.astro'"
    required: false
    default: "node_modules/.astro"
  out-dir:
    description: "Path to the output build directory (relative to 'path' input). Defaults to 'dist'"
    required: false
    default: "dist"

runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: toolchain
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        INPUT_PM: ${{ inputs.package-manager }}
        INPUT_NODE: ${{ inputs.node-version }}
        PROJECT_PATH: ${{ inputs.path }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const projectPath = path.resolve(process.env.GITHUB_WORKSPACE, process.env.PROJECT_PATH);
          const manifestPath = path.join(projectPath, 'package.json');
          const hasFile = (name) => fs.existsSync(path.join(projectPath, name));
          const nonempty = (value) => typeof value === 'string' && value.trim().length > 0;
          const readManifest = (filename) => {
            const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'));
            if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) {
              throw new Error(`Expected a package.json object in ${filename}`);
            }
            return manifest;
          };
          const manifest = hasFile('package.json') ? readManifest(manifestPath) : {};

          // Match setup-node's manifest precedence, but always supply a fallback.
          const visited = new Set();
          function nodeVersionFromManifest(filename, pkg) {
            if (nonempty(pkg.volta?.node)) return pkg.volta.node;
            const runtime = [pkg.devEngines?.runtime ?? []].flat().find(
              (entry) => entry?.name?.toLowerCase?.() === 'node' && nonempty(entry.version)
            );
            if (runtime) return runtime.version;
            if (nonempty(pkg.engines?.node)) return pkg.engines.node;
            if (nonempty(pkg.volta?.extends)) {
              const canonicalPath = fs.realpathSync(filename);
              if (visited.has(canonicalPath)) {
                throw new Error(`Circular Volta inheritance in ${filename}`);
              }
              visited.add(canonicalPath);
              const inheritedPath = path.resolve(path.dirname(filename), pkg.volta.extends);
              return nodeVersionFromManifest(inheritedPath, readManifest(inheritedPath));
            }
          }
          const nodeVersion = process.env.INPUT_NODE || nodeVersionFromManifest(manifestPath, manifest) || '24';
          core.setOutput('node-version', nodeVersion);

          let packageManager;
          let version = '';
          const input = process.env.INPUT_PM;
          if (input) {
            const separator = input.indexOf('@');
            packageManager = separator < 0 ? input : input.slice(0, separator);
            version = separator < 0 ? '' : input.slice(separator + 1);
          } else if (hasFile('pnpm-lock.yaml')) {
            packageManager = 'pnpm';
          } else if (hasFile('yarn.lock')) {
            packageManager = 'yarn';
          } else if (hasFile('package-lock.json')) {
            packageManager = 'npm';
          } else if (hasFile('bun.lock') || hasFile('bun.lockb')) {
            packageManager = 'bun';
          } else if (hasFile('deno.json') || hasFile('deno.jsonc') || hasFile('deno.lock')) {
            packageManager = 'deno';
          } else {
            throw new Error('No lockfile found. Please specify your preferred "package-manager" in the action configuration.');
          }

          const lockfiles = new Map([
            ['pnpm', 'pnpm-lock.yaml'], ['yarn', 'yarn.lock'], ['npm', 'package-lock.json'],
            ['bun', hasFile('bun.lock') ? 'bun.lock' : 'bun.lockb'], ['deno', 'deno.lock']
          ]);
          if (!lockfiles.has(packageManager)) {
            throw new Error(`Unsupported package manager: ${packageManager}`);
          }

          if (packageManager === 'pnpm' && !version) {
            // Let pnpm/action-setup resolve devEngines before packageManager.
            const devPM = manifest.devEngines?.packageManager;
            const declared = (!Array.isArray(devPM) && devPM?.name === 'pnpm' && nonempty(devPM.version)) ||
              (typeof manifest.packageManager === 'string' && manifest.packageManager.startsWith('pnpm@'));
            if (!declared) {
              version = 'latest';
              core.warning('No pnpm version found in package.json packageManager or devEngines.packageManager. Using latest PNPM version instead.');
            }
          } else if (!version) {
            if (packageManager === 'deno') version = 'vx.x.x';
            else if (packageManager === 'npm' || packageManager === 'bun') version = 'latest';
          }
          core.exportVariable('PACKAGE_MANAGER', packageManager);
          core.exportVariable('LOCKFILE', lockfiles.get(packageManager));
          core.exportVariable('VERSION', version);
    - name: Setup PNPM
      if: ${{ env.PACKAGE_MANAGER == 'pnpm' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ env.VERSION }}
        package_json_file: "${{ inputs.path }}/package.json"

    - name: Setup Bun
      if: ${{ env.PACKAGE_MANAGER == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.VERSION }}

    - name: Setup Deno
      if: ${{ env.PACKAGE_MANAGER == 'deno' }}
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ env.VERSION }}

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ env.PACKAGE_MANAGER != 'bun' && env.PACKAGE_MANAGER != 'deno' }}
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}
        cache: ${{ env.PACKAGE_MANAGER }}
        cache-dependency-path: "${{ inputs.path }}/${{ env.LOCKFILE }}"

    - name: Setup Node (Bun)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ env.PACKAGE_MANAGER == 'bun' }}
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ "$PACKAGE_MANAGER" = "deno" ]; then
          # For Deno projects with deno.json, cache dependencies
          if [ -f "deno.json" ] || [ -f "deno.jsonc" ]; then
            echo "Caching Deno dependencies..."
            deno cache --lock=deno.lock --lock-write **/*.ts **/*.tsx 2>/dev/null || true
          fi
          # For hybrid projects with package.json, install npm dependencies
          if [ -f "package.json" ]; then
            echo "Installing npm dependencies with Deno..."
            deno install --allow-scripts
          fi
        else
          # Standard package manager install
          $PACKAGE_MANAGER install
        fi

    - name: Restore Astro cache
      if: ${{ inputs.cache == 'true' }}
      id: astro-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/${{ inputs.cache-dir }}
        key: astro-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          astro-cache-${{ runner.os }}-

    - name: Build (npm/yarn/pnpm/bun)
      if: ${{ env.PACKAGE_MANAGER != 'deno' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: ${{ inputs.build-cmd || '$PACKAGE_MANAGER run build' }}

    - name: Build (Deno)
      if: ${{ env.PACKAGE_MANAGER == 'deno' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: ${{ inputs.build-cmd || 'deno task build' }}

    - name: Save Astro cache
      if: ${{ inputs.cache == 'true' && steps.astro-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/${{ inputs.cache-dir }}
        key: ${{ steps.astro-cache-restore.outputs.cache-primary-key }}

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: "${{ inputs.path }}/${{ inputs.out-dir }}/"
        include-hidden-files: true
