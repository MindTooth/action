name: Test toolchain resolution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix tests
      - run: npm test --prefix tests

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [runtime-object, runtime-array, node-override, bare-pnpm, pnpm-precedence, defaults, empty-fields, inherited-node, inherited-empty, npm-no-jq, npm-shrinkwrap, npm-no-lockfile, pnpm-no-lockfile]
    env:
      SCENARIO: ${{ matrix.scenario }}
      EXPECT_NODE: ${{ contains(fromJSON('["node-override", "defaults", "empty-fields", "inherited-empty", "npm-no-jq"]'), matrix.scenario) && '24' || '22' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create project fixture
        run: node tests/create-integration-fixture.mjs
      - name: Seed Node 22 to verify fallback replaces the existing runtime
        if: env.EXPECT_NODE == '24'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Make jq unavailable
        if: matrix.scenario == 'npm-no-jq'
        run: |
          mkdir -p "$RUNNER_TEMP/without-jq"
          printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/without-jq/jq"
          chmod +x "$RUNNER_TEMP/without-jq/jq"
          echo "$RUNNER_TEMP/without-jq" >> "$GITHUB_PATH"
      - name: Install and build with the composite action
        uses: ./
        with:
          path: work/test site
          node-version: ${{ matrix.scenario == 'node-override' && '24' || '' }}
          package-manager: ${{ matrix.scenario == 'pnpm-no-lockfile' && 'pnpm@11.28.2' || matrix.scenario == 'bare-pnpm' && 'pnpm' || startsWith(matrix.scenario, 'npm-') && 'npm' || '' }}
          cache: false
      - name: Verify build output
        run: test -f 'work/test site/dist/index.html'
