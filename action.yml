name: "Astro Deploy"
description: "A composite action that prepares your Astro site to be deployed to GitHub Pages"
branding:
  icon: "arrow-up-right"
  color: "purple"
inputs:
  node-version:
    description: "Node version override. Otherwise use package.json (Volta, devEngines.runtime, or engines.node), falling back to 24."
    required: false
    default: ""
  package-manager:
    description: "You may specify your preferred package manager (one of `npm | yarn | pnpm | bun | deno` and an optional `@<version>` tag). Otherwise, the package manager will be automatically detected."
    required: false
    default: ""
  path:
    description: "Path of the directory containing your site"
    required: false
    default: "."
  build-cmd:
    description: "The command used to build your site"
    required: false
    default:
  cache:
    description: "Enable Astro cache to speed up subsequent builds (caches optimized images and other assets)"
    required: false
    default: "true"
  cache-dir:
    description: "Path to the Astro cache directory (relative to 'path' input). Defaults to 'node_modules/.astro'"
    required: false
    default: "node_modules/.astro"
  out-dir:
    description: "Path to the output build directory (relative to 'path' input). Defaults to 'dist'"
    required: false
    default: "dist"

runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: toolchain
      shell: "bash"
      working-directory: ${{ inputs.path }}
      env:
        INPUT_PM: ${{ inputs.package-manager }}
        INPUT_NODE: ${{ inputs.node-version }}
        PROJECT_PATH: ${{ inputs.path }}
      run: |
        # Fail on malformed manifests rather than silently selecting defaults.
        if [ -f package.json ]; then
          jq empty package.json
        fi

        NODE_VERSION="$INPUT_NODE"
        NODE_VERSION_FILE=""
        if [ -z "$NODE_VERSION" ]; then
          # Let setup-node resolve precedence, runtime arrays, and Volta inheritance.
          if [ -f package.json ] && jq -e '
            .volta.node or .volta.extends or .engines.node or
            ([.devEngines.runtime // []] | flatten |
              any((.name? | strings | ascii_downcase == "node") and
                (.version? | strings | length > 0)))
          ' package.json > /dev/null; then
            NODE_VERSION_FILE="$PROJECT_PATH/package.json"
          else
            NODE_VERSION="24"
          fi
        fi
        echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
        echo "node-version-file=$NODE_VERSION_FILE" >> "$GITHUB_OUTPUT"

        VERSION=""
        LOCKFILE=""
        if [ -n "$INPUT_PM" ]; then
          PACKAGE_MANAGER="${INPUT_PM%%@*}"
          if [[ "$INPUT_PM" == *@* ]]; then
            VERSION="${INPUT_PM#*@}"
          fi
        elif [ -f pnpm-lock.yaml ]; then
          PACKAGE_MANAGER="pnpm"
        elif [ -f yarn.lock ]; then
          PACKAGE_MANAGER="yarn"
        elif [ -f package-lock.json ]; then
          PACKAGE_MANAGER="npm"
        elif [ -f bun.lock ] || [ -f bun.lockb ]; then
          PACKAGE_MANAGER="bun"
        elif [ -f deno.json ] || [ -f deno.jsonc ] || [ -f deno.lock ]; then
          PACKAGE_MANAGER="deno"
        else
          echo 'No lockfile found. Please specify your preferred "package-manager" in the action configuration.'
          exit 1
        fi

        # Determine the cache lockfile even when the package manager is explicit.
        case "$PACKAGE_MANAGER" in
          pnpm) LOCKFILE="pnpm-lock.yaml" ;;
          yarn) LOCKFILE="yarn.lock" ;;
          npm) LOCKFILE="package-lock.json" ;;
          bun)
            if [ -f bun.lock ]; then LOCKFILE="bun.lock"; else LOCKFILE="bun.lockb"; fi
            ;;
          deno) LOCKFILE="deno.lock" ;;
          *) echo "Unsupported package manager: $PACKAGE_MANAGER"; exit 1 ;;
        esac

        if [ "$PACKAGE_MANAGER" = "pnpm" ] && [ -z "$VERSION" ]; then
          # pnpm/action-setup resolves devEngines before packageManager itself.
          if ! { [ -f package.json ] && jq -e '
            ((.devEngines.packageManager | type) == "object" and
              .devEngines.packageManager.name == "pnpm" and
              (.devEngines.packageManager.version | strings | length > 0)) or
            (.packageManager | strings | startswith("pnpm@"))
          ' package.json > /dev/null; }; then
            VERSION="latest"
            echo '::warning title=Could not detect PNPM version::No pnpm version found in package.json packageManager or devEngines.packageManager. Using latest PNPM version instead.'
          fi
        elif [ -z "$VERSION" ]; then
          case "$PACKAGE_MANAGER" in
            deno) VERSION="vx.x.x" ;;
            npm|bun) VERSION="latest" ;;
          esac
        fi
        echo "PACKAGE_MANAGER=$PACKAGE_MANAGER" >> "$GITHUB_ENV"
        echo "LOCKFILE=$LOCKFILE" >> "$GITHUB_ENV"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Setup PNPM
      if: ${{ env.PACKAGE_MANAGER == 'pnpm' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ env.VERSION }}
        package_json_file: "${{ inputs.path }}/package.json"

    - name: Setup Bun
      if: ${{ env.PACKAGE_MANAGER == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.VERSION }}

    - name: Setup Deno
      if: ${{ env.PACKAGE_MANAGER == 'deno' }}
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ env.VERSION }}

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ env.PACKAGE_MANAGER != 'bun' && env.PACKAGE_MANAGER != 'deno' }}
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}
        node-version-file: ${{ steps.toolchain.outputs.node-version-file }}
        cache: ${{ env.PACKAGE_MANAGER }}
        cache-dependency-path: "${{ inputs.path }}/${{ env.LOCKFILE }}"

    - name: Setup Node (Bun)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ env.PACKAGE_MANAGER == 'bun' }}
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}
        node-version-file: ${{ steps.toolchain.outputs.node-version-file }}

    - name: Install
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ "$PACKAGE_MANAGER" = "deno" ]; then
          # For Deno projects with deno.json, cache dependencies
          if [ -f "deno.json" ] || [ -f "deno.jsonc" ]; then
            echo "Caching Deno dependencies..."
            deno cache --lock=deno.lock --lock-write **/*.ts **/*.tsx 2>/dev/null || true
          fi
          # For hybrid projects with package.json, install npm dependencies
          if [ -f "package.json" ]; then
            echo "Installing npm dependencies with Deno..."
            deno install --allow-scripts
          fi
        else
          # Standard package manager install
          $PACKAGE_MANAGER install
        fi

    - name: Restore Astro cache
      if: ${{ inputs.cache == 'true' }}
      id: astro-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/${{ inputs.cache-dir }}
        key: astro-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          astro-cache-${{ runner.os }}-

    - name: Build (npm/yarn/pnpm/bun)
      if: ${{ env.PACKAGE_MANAGER != 'deno' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: ${{ inputs.build-cmd || '$PACKAGE_MANAGER run build' }}

    - name: Build (Deno)
      if: ${{ env.PACKAGE_MANAGER == 'deno' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: ${{ inputs.build-cmd || 'deno task build' }}

    - name: Save Astro cache
      if: ${{ inputs.cache == 'true' && steps.astro-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/${{ inputs.cache-dir }}
        key: ${{ steps.astro-cache-restore.outputs.cache-primary-key }}

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: "${{ inputs.path }}/${{ inputs.out-dir }}/"
        include-hidden-files: true
